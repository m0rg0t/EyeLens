name: Portable source regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require preinstalled .NET 10 (no toolchain installation)
        run: dotnet --version
      - name: Run source-linked synthetic regressions (no package sources)
        run: dotnet run --project tests/Portable.Tests/Portable.Tests.csproj --configuration Release
